<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      background: #fffbf5;
      color: #1f2557;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              border: 1px solid #e7e2da;
              border-radius: 12px;
              background: #ffffff;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 1.5px;
                    text-transform: uppercase;
                    color: #2e3680;
                  "
                >
                  València Hack · Cátedra Valent-IA
                </p>
                <h1
                  style="
                    margin: 0 0 16px;
                    font-size: 28px;
                    line-height: 1.2;
                    color: #1f2557;
                  "
                >
                  Tu código de acceso
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #6b6f86;
                  "
                >
                  Escríbelo en la plataforma para confirmar tu identidad:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    border-radius: 10px;
                    background: #fde6cf;
                    padding: 18px;
                    text-align: center;
                    font-size: 32px;
                    font-weight: 700;
                    letter-spacing: 6px;
                    color: #1f2557;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #6b6f86;
                  "
                >
                  Caduca en 10 minutos. Si no has solicitado este código, puedes
                  ignorar el correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
